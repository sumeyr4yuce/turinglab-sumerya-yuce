name: "anbn_1tape"
description: "L = {a^n b^n} dilini tek şeritli TM ile tanır. O(n^2)."

states:
  - q_find_a
  - q_find_b
  - q_return
  - q_check
  - q_accept

input_alphabet: ["a", "b"]
tape_alphabet: ["a", "b", "X", "Y", "B"]
blank: "B"
start_state: q_find_a
accept_states: [q_accept]
reject_states: []

# Strateji: en soldaki işaretsiz 'a' bulunup X yapılır, ardından en soldaki
# işaretsiz 'b' bulunup Y yapılır, sonra başa dönülüp tekrarlanır.
# Her tur tüm bant taranır -> O(n^2) toplam adım.

transitions:
  # q_find_a: ilk işaretsiz a'yı bul
  - {state: q_find_a, read: X, next: q_find_a, write: X, move: R}
  - {state: q_find_a, read: a, next: q_find_b, write: X, move: R}
  - {state: q_find_a, read: Y, next: q_check,  write: Y, move: R}
  - {state: q_find_a, read: B, next: q_accept, write: B, move: R}

  # q_find_b: ilk işaretsiz b'yi bul (a'lar ve Y'ler arasında ilerle)
  - {state: q_find_b, read: a, next: q_find_b, write: a, move: R}
  - {state: q_find_b, read: Y, next: q_find_b, write: Y, move: R}
  - {state: q_find_b, read: b, next: q_return, write: Y, move: L}

  # q_return: başa dön
  - {state: q_return, read: X, next: q_return, write: X, move: L}
  - {state: q_return, read: Y, next: q_return, write: Y, move: L}
  - {state: q_return, read: a, next: q_return, write: a, move: L}
  - {state: q_return, read: b, next: q_return, write: b, move: L}
  - {state: q_return, read: B, next: q_find_a, write: B, move: R}

  # q_check: kalan tüm sembollerin Y olduğunu doğrula
  - {state: q_check, read: Y, next: q_check,   write: Y, move: R}
  - {state: q_check, read: B, next: q_accept,  write: B, move: R}
