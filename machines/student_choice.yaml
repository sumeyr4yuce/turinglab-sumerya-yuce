name: "binary_divisible_by_4"
description: "Normalize edilmiş ikili girdinin 4'e bölünüp bölünmediğini test eder."

states:
  - q_start
  - q_single0
  - q_seen_one
  - q_last0
  - q_last1
  - q_suffix00
  - q_accept
  - q_reject

input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", "B"]
blank: "B"
start_state: q_start
accept_states: [q_accept]
reject_states: [q_reject]

transitions:
  # Boş girdi sayı değildir.
  - {state: q_start, read: "B", next: q_reject, write: "B", move: R}

  # Tek 0 sayısı 0'ı temsil eder ve 4'e bölünür.
  - {state: q_start, read: "0", next: q_single0, write: "0", move: R}
  - {state: q_start, read: "1", next: q_seen_one, write: "1", move: R}

  - {state: q_single0, read: "0", next: q_suffix00, write: "0", move: R}
  - {state: q_single0, read: "1", next: q_last1, write: "1", move: R}
  - {state: q_single0, read: "B", next: q_accept, write: "B", move: R}

  - {state: q_seen_one, read: "0", next: q_last0, write: "0", move: R}
  - {state: q_seen_one, read: "1", next: q_last1, write: "1", move: R}
  - {state: q_seen_one, read: "B", next: q_reject, write: "B", move: R}

  - {state: q_last0, read: "0", next: q_suffix00, write: "0", move: R}
  - {state: q_last0, read: "1", next: q_last1, write: "1", move: R}
  - {state: q_last0, read: "B", next: q_reject, write: "B", move: R}

  - {state: q_last1, read: "0", next: q_last0, write: "0", move: R}
  - {state: q_last1, read: "1", next: q_last1, write: "1", move: R}
  - {state: q_last1, read: "B", next: q_reject, write: "B", move: R}

  - {state: q_suffix00, read: "0", next: q_suffix00, write: "0", move: R}
  - {state: q_suffix00, read: "1", next: q_last1, write: "1", move: R}
  - {state: q_suffix00, read: "B", next: q_accept, write: "B", move: R}
