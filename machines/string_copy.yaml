name: "string_copy"
description: "a/b alfabesindeki girdiyi kopyalar. Örnek: abba -> abba#abba"

states:
  - q_seek_end
  - q_return_left
  - q_find
  - q_append_a
  - q_append_b
  - q_restore
  - q_accept

input_alphabet: ["a", "b"]
tape_alphabet: ["a", "b", "B", "#", "A", "C"]
blank: "B"
start_state: q_seek_end
accept_states: [q_accept]
reject_states: []

transitions:
  # Girdinin sonuna # ayıracı koy.
  - {state: q_seek_end, read: "a", next: q_seek_end, write: "a", move: R}
  - {state: q_seek_end, read: "b", next: q_seek_end, write: "b", move: R}
  - {state: q_seek_end, read: "B", next: q_return_left, write: "#", move: L}

  - {state: q_return_left, read: "a", next: q_return_left, write: "a", move: L}
  - {state: q_return_left, read: "b", next: q_return_left, write: "b", move: L}
  - {state: q_return_left, read: "A", next: q_return_left, write: "A", move: L}
  - {state: q_return_left, read: "C", next: q_return_left, write: "C", move: L}
  - {state: q_return_left, read: "#", next: q_return_left, write: "#", move: L}
  - {state: q_return_left, read: "B", next: q_find, write: "B", move: R}

  # Kopyalanmamış ilk karakteri işaretle.
  - {state: q_find, read: "A", next: q_find, write: "A", move: R}
  - {state: q_find, read: "C", next: q_find, write: "C", move: R}
  - {state: q_find, read: "a", next: q_append_a, write: "A", move: R}
  - {state: q_find, read: "b", next: q_append_b, write: "C", move: R}
  - {state: q_find, read: "#", next: q_restore, write: "#", move: L}

  - {state: q_append_a, read: "a", next: q_append_a, write: "a", move: R}
  - {state: q_append_a, read: "b", next: q_append_a, write: "b", move: R}
  - {state: q_append_a, read: "A", next: q_append_a, write: "A", move: R}
  - {state: q_append_a, read: "C", next: q_append_a, write: "C", move: R}
  - {state: q_append_a, read: "#", next: q_append_a, write: "#", move: R}
  - {state: q_append_a, read: "B", next: q_return_left, write: "a", move: L}

  - {state: q_append_b, read: "a", next: q_append_b, write: "a", move: R}
  - {state: q_append_b, read: "b", next: q_append_b, write: "b", move: R}
  - {state: q_append_b, read: "A", next: q_append_b, write: "A", move: R}
  - {state: q_append_b, read: "C", next: q_append_b, write: "C", move: R}
  - {state: q_append_b, read: "#", next: q_append_b, write: "#", move: R}
  - {state: q_append_b, read: "B", next: q_return_left, write: "b", move: L}

  # Sol bölümdeki işaretleri geri al.
  - {state: q_restore, read: "A", next: q_restore, write: "a", move: L}
  - {state: q_restore, read: "C", next: q_restore, write: "b", move: L}
  - {state: q_restore, read: "a", next: q_restore, write: "a", move: L}
  - {state: q_restore, read: "b", next: q_restore, write: "b", move: L}
  - {state: q_restore, read: "B", next: q_accept, write: "B", move: R}
